spring:
  application:
    name: bom-coffee-pos

  datasource:
    url: ${DB_URL:jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/pos_bomcoffe?sslMode=VERIFY_IDENTITY}
    username: ${DB_USERNAME:3Bx2cAUiS293NeD.root}
    password: ${DB_PASSWORD:GqLF0LJRC8YuCB8g}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jackson:
    time-zone: Asia/Ho_Chi_Minh
    serialization:
      write-dates-as-timestamps: false

  jpa:
    hibernate:
      ddl-auto: update  # Hibernate tự động update schema
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  flyway:
    enabled: false  # Tắt Flyway, dùng Hibernate auto-update

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:doslcoy82}
  api-key: ${CLOUDINARY_API_KEY:782598553554941}
  api-secret: ${CLOUDINARY_API_SECRET:XIrVpff4K5tVeMm4nd4NW8XB0Bo}

server:
  port: 8080
  servlet:
    context-path: /

app:
  jwt:
    secret: ${JWT_SECRET:bom-coffee-pos-super-secret-key-2024-change-in-production}
    expiration-ms: 86400000       # 1 day
    refresh-expiration-ms: 604800000  # 7 days

logging:
  level:
    com.bomcoffee: INFO
    org.springframework.security: WARN
